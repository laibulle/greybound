[package]
name = "greybound-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
homepage = ""

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
greybound = { path = "../core", default-features = false }
greybound-plugin-ui = { path = "../plugin-ui" }
greybound-ui = { path = "../ui" }
iced = { version = "0.10", default-features = false, features = ["advanced", "canvas", "image"] }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
