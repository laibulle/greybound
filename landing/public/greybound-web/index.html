<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Greybound Web</title>
    <style>
      html,
      body,
      #greybound-web-root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0c0f0f;
      }

      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f6efe2;
        font: 700 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <div id="greybound-web-root">
      <div class="boot">Loading Greybound...</div>
    </div>
    <script type="module">
      import init, { run } from "./pkg/greybound_wasm.js?v=rust-assets-20260709";

      await init("./pkg/greybound_wasm_bg.wasm?v=rust-assets-20260709");
      try {
        run();
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        if (!message.includes("Using exceptions for control flow")) {
          throw error;
        }
      }
    </script>
  </body>
</html>
