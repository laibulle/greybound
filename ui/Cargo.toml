[package]
name = "greybound-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared Greybound desktop UI layer for iced."

[dependencies]
greybound = { path = "../core", default-features = false }
iced = { version = "0.10", features = ["advanced", "canvas", "image"] }
image = { version = "0.24", default-features = false, features = ["png"] }
