<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2172" viewBox="0 0 1200 2172">
  <title>Greybound standard pedal mechanical template</title>
  <desc>
    Layout guide for Greybound pedal assets. It standardizes the enclosure,
    side I/O jack footprints, footswitch anchor, and control-label offset.
    Control count, position, and size are intentionally unrestricted.
    Guides must not appear in final artwork.
  </desc>

  <!-- Exact file boundary / transparent production canvas. -->
  <rect width="1200" height="2172" fill="none"/>
  <rect x="2" y="2" width="1196" height="2168" fill="none" stroke="#64748b" stroke-width="4"/>

  <!-- Enclosure silhouette, 24 px bevel, and internal no-crop area. -->
  <g fill="none">
    <rect x="72" y="72" width="1056" height="2028" rx="72"
          stroke="#00a7ff" stroke-width="6" stroke-dasharray="24 18"/>
    <rect x="96" y="96" width="1008" height="1980" rx="48"
          stroke="#a78bfa" stroke-width="4" stroke-dasharray="10 10"/>
    <rect x="112" y="112" width="976" height="1948" rx="52"
          stroke="#62d26f" stroke-width="4" stroke-dasharray="18 14"/>
  </g>

  <!-- Fixed side I/O jack placeholders: 72 x 136, wholly outside the front face. -->
  <g fill="#ffb347" fill-opacity="0.14" stroke="#ffb347" stroke-width="5" stroke-dasharray="14 12">
    <rect x="0" y="1018" width="72" height="136"/>
    <rect x="1128" y="1018" width="72" height="136"/>
  </g>

  <!-- Footswitch placement only: centre (600, 1780). -->
  <g stroke="#ff4fd8" stroke-width="4">
    <line x1="584" y1="1780" x2="616" y2="1780"/>
    <line x1="600" y1="1764" x2="600" y2="1796"/>
  </g>

  <!-- Reference only: labels sit 177 px below their freely chosen control anchor. -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="12 10">
    <circle cx="600" cy="600" r="16"/>
    <line x1="600" y1="600" x2="600" y2="777"/>
    <line x1="574" y1="600" x2="626" y2="600"/>
    <line x1="574" y1="777" x2="626" y2="777"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
    <text x="600" y="828" font-size="34" text-anchor="middle">control label baseline</text>
    <text x="600" y="888" font-size="28" text-anchor="middle">anchor + 177 px</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="28">
    <text x="72" y="48" fill="#00a7ff">canvas 1200 × 2172 transparent PNG</text>
    <text x="600" y="146" fill="#a78bfa" text-anchor="middle">24 px bevel · outer corner radius 72 px</text>
    <text x="120" y="1096" fill="#ffb347" font-size="44" text-anchor="start">IN</text>
    <text x="1080" y="1096" fill="#ffb347" font-size="44" text-anchor="end">OUT</text>
    <text x="600" y="2140" fill="#62d26f" text-anchor="middle">Controls are deliberately free: no prescribed grid or control footprint.</text>
  </g>
</svg>
