[package]
name = "greybound-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Greybound web app host using the shared iced UI."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
greybound-ui = { path = "../ui" }
iced = { version = "0.10", default-features = false, features = ["canvas", "image", "web-colors"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
